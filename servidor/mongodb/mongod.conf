# /etc/mongod.conf
storage:
  dbPath: /datos/mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 127.0.0.1,192.168.1.233

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

security:
  authorization: enabled
