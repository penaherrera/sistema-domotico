# /etc/netplan/01-ip-estatica.yaml  (permisos 600)
network:
  version: 2
  ethernets:
    enp0s3:
      dhcp4: false
      accept-ra: false
      addresses:
        - 192.168.1.233/24
      routes:
        - to: default
          via: 192.168.1.254
      nameservers:
        addresses: [127.0.0.1]
        search: [domotica.lan]
